<!DOCTYPE html>
<html>
<head>
    <title>CT Calculator Task</title>

    <style>
        body{
            font-family: Georgia, serif;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            margin:20px;
        }

        .keyboard{
            width:90%;
            margin:30px auto;
            padding:20px;
            border:1px solid #dcdcdc;
            border-radius:15px;

            display:grid;
            grid-template-columns: repeat(12, 1fr);
            gap:10px;
        }

        .key{
            background:#ececec;
            border-radius:12px;
            padding:25px 10px;
            text-align:center;
            font-size:18px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.08);
        }

        .wide{
            grid-column: span 2;
        }

        .space{
            grid-column: span 4;
            font-weight:bold;
            color:#1f3f5a;
        }

        .blue{
            font-weight:bold;
            color:#1f3f5a;
        }
    </style>

</head>
<body>

<h1>CT Calculator Task</h1>

<div class="keyboard">

    <!-- Row 1 -->
    <div class="key wide">~</div>
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key">0</div>
    <div class="key">Delete</div>

    <!-- Row 2 -->
    <div class="key wide">tab</div>
    <div class="key">Q</div>
    <div class="key">W</div>
    <div class="key">E</div>
    <div class="key">R</div>
    <div class="key">T</div>
    <div class="key">Y</div>
    <div class="key">U</div>
    <div class="key">I</div>
    <div class="key">O</div>
    <div class="key">P</div>
    <div class="key">\</div>

    <!-- Row 3 -->
    <div class="key wide">Caps</div>
    <div class="key">A</div>
    <div class="key">S</div>
    <div class="key">D</div>
    <div class="key">F</div>
    <div class="key">G</div>
    <div class="key">H</div>
    <div class="key">J</div>
    <div class="key">K</div>
    <div class="key">L</div>
    <div class="key wide blue">Enter</div>

    <!-- Row 4 -->
    <div class="key wide">Shift</div>
    <div class="key">Z</div>
    <div class="key">X</div>
    <div class="key">C</div>
    <div class="key">V</div>
    <div class="key">B</div>
    <div class="key">N</div>
    <div class="key">M</div>
    <div class="key">&lt;</div>
    <div class="key">&gt;</div>
    <div class="key wide blue">Shift</div>

    <!-- Row 5 -->
    <div class="key">Windows</div>
    <div class="key">ctrl</div>
    <div class="key">Options</div>
    <div class="key">Alt</div>
    <div class="key space">Space</div>
    <div class="key">alt</div>
    <div class="key">Option</div>
    <div class="key">&lt;</div>
    <div class="key">&gt;</div>

</div>

</body>
</html>
