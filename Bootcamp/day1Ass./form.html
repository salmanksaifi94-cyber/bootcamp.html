<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration</title>
    <style>
        body{
            font-family: Times New Roman;
            margin: 20px;
        }

        h1{
            margin-bottom: 30px;
        }

        input{
            padding: 5px;
        }

        .btn{
            padding: 8px 15px;
        }
    </style>
</head>
<body>

<h1>College Event Registration 📝</h1>

<form>

    <label>Your Name:</label>
    <input type="text" size="30"><br><br><br>

    <label>Email:</label>
    <input type="email" size="30"><br><br><br>

    <label>Age:</label>
    <input type="number" style="width:80px;"><br><br><br>

    <label>Select Event Category:</label><br><br>

    <input type="checkbox"> Coding Hackathon <br>
    <input type="checkbox"> Debate Competition <br>
    <input type="checkbox"> Sports Tournament <br><br><br>

    <label>Event Date:</label>
    <input type="date"><br><br><br>

    <label>Preferred Time Slot:</label>
    <input type="time"><br><br><br>

    <input type="submit" value="Register Now" class="btn">

</form>

</body>
</html>
